<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI - Telegram Mini App</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="font-bold text-lg flex items-center gap-2">
            🤖 Gemini AI Ассистент
        </h1>
        <div id="user-info" class="text-xs text-slate-400 bg-slate-700 px-3 py-1.5 rounded-full">
            Загрузка...
        </div>
    </header>

انيا<!-- Основной контент (теперь всегда виден) -->
    <main id="app-content" class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center items-center text-center">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl w-full">
            <h2 class="text-xl font-bold mb-3 text-indigo-400">Добро пожаловать в Web App!</h2>
            <p class="text-slate-300 text-sm mb-6">
                Приложение успешно запущенно. Блокировка отключена, интерфейс работает везде.
            </p>
            
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 text-sm text-left mb-4">
                <p><strong>Telegram ID:</strong> <span id="tg-id" class="text-indigo-300"></span></p>
                <p><strong>Имя:</strong> <span id="tg-name" class="text-indigo-300"></span></p>
            </div>

            <button onclick="closeApp()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                Закрыть приложение
            </button>
        </div>
    </main>

    <!-- Скрипт без блокировок -->
    <script>
        const tg = window.Telegram.WebApp;
        try {
            tg.ready();
            tg.expand();
        } catch (e) {}

        // Получаем данные из Telegram (если открыто в боте)
        let userId = tg.initDataUnsafe?.user?.id;
        let firstName = tg.initDataUnsafe?.user?.first_name || "";
        let username = tg.initDataUnsafe?.user?.username || "";

        // Если открыто в обычном браузере — ставим демо-данные, чтобы ничего не падало
        if (!userId) {
            userId = "DEMO_USER_999";
            firstName = "Пользователь (Браузер)";
            username = "browser_user";
        }

        // Заполняем данные на странице
        document.getElementById("tg-id").textContent = userId;
        document.getElementById("tg-name").textContent = `${firstName} (@${username})`;
        document.getElementById("user-info").textContent = `ID: ${userId}`;

        function closeApp() {
            try {
                tg.close();
            } catch (e) {
                alert("Закрытие доступно только внутри Telegram");
            }
        }
    </script>
</body>
</html>
