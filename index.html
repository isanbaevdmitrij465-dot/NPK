<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI - Telegram Mini App</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="font-bold text-lg flex items-center gap-2">
            🤖 Gemini AI Ассистент
        </h1>
        <div id="user-info" class="text-xs text-slate-400 bg-slate-700 px-3 py-1.5 rounded-full">
            Загрузка...
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center items-center text-center">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl w-full">
            <h2 id="welcome-title" class="text-xl font-bold mb-3 text-indigo-400">Добро пожаловать в Web App!</h2>
            <p id="welcome-desc" class="text-slate-300 text-sm mb-6">
                Приложение успешно запущено.
            </p>
            
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 text-sm text-left mb-4">
                <p><strong>Режим:</strong> <span id="env-mode" class="text-emerald-400">Определение...</span></p>
                <p><strong>Telegram ID:</strong> <span id="tg-id" class="text-indigo-300"></span></p>
                <p><strong>Имя:</strong> <span id="tg-name" class="text-indigo-300"></span></p>
            </div>

            <button onclick="closeApp()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                Закрыть приложение
            </button>
        </div>
    </main>

    <!-- Универсальный скрипт определения платформы -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            
            // Инициализируем WebApp, если он доступен
            try {
                tg.ready();
                if (tg.expand) tg.expand();
            } catch (e) {
                console.log("WebApp не инициализирован (обычный браузер)");
            }

            // Пытаемся получить данные пользователя из Telegram
            let userId = tg.initDataUnsafe?.user?.id;
            let firstName = tg.initDataUnsafe?.user?.first_name || "";
            let username = tg.initDataUnsafe?.user?.username || "";
            
            let environment = "Обычный браузер (Демо-режим)";

            // Проверяем, запущен ли сайт в Telegram (на телефоне, ПК или в Web-версии)
            // Telegram всегда передает initData или platform при открытии из бота
            if (userId || (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== "unknown")) {
                if (!userId) {
                    // Если это Telegram, но имя пользователя почему-то скрыто настройками приватности
                    userId = "Telegram User (ID скрыт)";
                    firstName = "Пользователь Telegram";
                }
                environment = `Telegram (${tg.platform || 'WebApp'})`;
            } else {
                // Если это действительно обычный браузер (Chrome, Safari, Yandex и т.д.)
                userId = "DEMO_ID_99999";
                firstName = "Гость";
                username = "browser_user";
            }

            // Выводим данные на экран
            document.getElementById("env-mode").textContent = environment;
            document.getElementById("tg-id").textContent = userId;
            document.getElementById("tg-name").textContent = `${firstName} (@${username || 'нет'})`;
            document.getElementById("user-info").textContent = userId.toString().startsWith("DEMO") ? "Демо" : `ID: ${userId}`;
        });

        function closeApp() {
            try {
                window.Telegram.WebApp.close();
            } catch (e) {
                alert("Закрытие доступно только при запуске из Telegram");
            }
        }
    </script>
</body>
</html>
